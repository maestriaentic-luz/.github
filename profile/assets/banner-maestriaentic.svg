<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Maestría en Tecnologías de Información y Comunicación</title>
  <desc id="desc">Banner institucional de la Maestría en TIC de la Universidad del Zulia con el escudo oficial de LUZ</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1E6E"/>
      <stop offset="0.58" stop-color="#2350D2"/>
      <stop offset="1" stop-color="#5375C8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="crest-circle">
      <circle cx="1360" cy="250" r="162"/>
    </clipPath>
    <filter id="crest-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10134F" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#background)"/>
  <rect width="1600" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="1415" cy="84" r="230" fill="#FFFFFF" fill-opacity=".06"/>
  <circle cx="1485" cy="430" r="300" fill="#1C1E6E" fill-opacity=".18"/>

  <g filter="url(#crest-shadow)">
    <circle cx="1360" cy="250" r="174" fill="#FFFFFF" fill-opacity=".98"/>
    <circle cx="1360" cy="250" r="174" fill="none" stroke="#D0BB34" stroke-width="4"/>
    <image href="luz-logo.png" x="1198" y="88" width="324" height="324" preserveAspectRatio="xMidYMid meet" clip-path="url(#crest-circle)"/>
  </g>

  <text x="105" y="112" fill="#D0BB34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="3">UNIVERSIDAD DEL ZULIA</text>
  <text x="105" y="205" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="63" font-weight="800">Maestría en Tecnologías de</text>
  <text x="105" y="280" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="63" font-weight="800">Información y Comunicación</text>
  <rect x="105" y="332" width="885" height="3" fill="#D0BB34"/>
  <text x="105" y="390" fill="#FFFFFF" fill-opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29">Investigación, innovación y transformación digital con impacto social</text>
  <g transform="translate(105 430)">
    <rect width="155" height="44" rx="22" fill="#D0BB34"/>
    <text x="77.5" y="29" text-anchor="middle" fill="#1C1E6E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">32 UC</text>
    <rect x="174" width="250" height="44" rx="22" fill="#FFFFFF" fill-opacity=".13" stroke="#FFFFFF" stroke-opacity=".35"/>
    <text x="299" y="29" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">POSGRADO · LUZ</text>
  </g>
</svg>
